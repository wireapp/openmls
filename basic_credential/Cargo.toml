[package]
name = "openmls_basic_credential"
version = "0.2.0"
authors = ["OpenMLS Authors"]
edition = "2021"
description = "A Basic Credential implementation for OpenMLS"
license = "MIT"
documentation = "https://docs.rs/openmls_basic_credential"
repository = "https://github.com/openmls/openmls/tree/main/basic_credential"
readme = "README.md"

[dependencies]
openmls_traits = { version = "0.2.0", path = "../traits" }
tls_codec = { workspace = true }
async-trait = { workspace = true }
serde = "1.0"

# Rust Crypto
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
elliptic-curve = "0.14"
p256 = "0.14"
p384 = "0.14"
p521 = "0.14"
secrecy = { version = "0.8", features = ["serde"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["wasm_js"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"

[dev-dependencies]
rand = "0.10"
openmls_rust_crypto = { version = "0.2.0", path = "../openmls_rust_crypto" }

[features]
clonable = [] # Make the keys clonable
test-utils = [] # Only use for tests!
