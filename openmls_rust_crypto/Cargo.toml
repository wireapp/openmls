[package]
name = "openmls_rust_crypto"
authors = ["OpenMLS Authors"]
version = "0.2.0"
edition = "2021"
description = "A crypto backend for OpenMLS implementing openmls_traits using RustCrypto primitives."
license = "MIT"
documentation = "https://docs.rs/openmls_rust_crypto"
repository = "https://github.com/openmls/openmls/tree/main/openmls_rust_crypto"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
openmls_traits = { version = "0.2.0", path = "../traits" }
openmls_memory_keystore = { version = "0.2.0", path = "../memory_keystore" }
# Rust Crypto dependencies
sha2 = { version = "0.11" }
aes-gcm = { version = "0.11" }
chacha20poly1305 = { version = "0.11" }
hmac = { version = "0.13" }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
elliptic-curve = "0.14"
getrandom = { version = "0.4", features = ["wasm_js"] }
p256 = { version = "0.14" }
p384 = { version = "0.14" }
p521 = { version = "0.14" }
hkdf = { version = "0.13" }
rand_core = "0.10"
rand_chacha = "0.10"
tls_codec = { workspace = true }
zeroize = { version = "1.9", features = ["derive"] }
signature = "3.0"
thiserror = "1.0"
generic-array = "0.14"
hpke = { version = "0.14", features = ["x25519", "nistp", "aes"] }
